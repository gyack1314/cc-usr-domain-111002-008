<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>跨时区业务日期控件的区间采集 RPA</title><meta name="description" content="本地合成业务门户"><link rel="stylesheet" href="/style.css"></head><body><a href="#main">跳到操作区</a><main id="main"><h1>跨时区业务日期控件的区间采集 RPA</h1><p>本地合成资料，仅用于业务接入开发。</p><p id="status" class="status" role="status">页面加载中</p><p id="timezone">门户时区 America/New_York</p><div class="controls"><button data-open-date="start">起点日期</button><input id="start-date" readonly value="2026-11-01"><select id="start-time"></select><select id="start-fold"><option value="0">第一次 UTC−04</option><option value="1">第二次 UTC−05</option></select><button data-open-date="end">终点日期</button><input id="end-date" readonly value="2026-11-01"><select id="end-time"></select><select id="end-fold"><option value="0">第一次 UTC−04</option><option value="1">第二次 UTC−05</option></select><button id="query">查询分钟资料</button></div><dialog id="calendar"><button id="prev">上月</button><span id="month"></span><button id="next">下月</button><div id="days"></div><button id="close-calendar">关闭日期选择</button></dialog><p id="utc-summary"></p><section id="results"></section><footer>数据与账号均为本地合成材料。</footer></main><script type="module" src="/app.js"></script></body></html>
